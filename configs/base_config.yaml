# ==============================================================================
# netml-cl project — configs/base_config.yaml
# ==============================================================================
#
# DATASET CONTEXT
# ---------------
# Two datasets live under data/raw/, each already pre-split by the original
# challenge into four folders — this is NOT something we re-split ourselves:
#
#   0_test-challenge_set/
#   1_test-std_set/
#   2_training_annotations/   (labels, only exists for the training set)
#   2_training_set/           (features, as a .json.gz file, e.g.
#                              2_training_set.json.gz)
#
# Both datasets have 121 raw features per flow (same schema).
#
# netml2020 (data/raw/netml2020/2_training_set): 387,268 training rows,
# 21 classes: Adload, Artemis, BitCoinMiner, CCleaner, Cobalt, Downware,
# Dridex, Emotet, HTBot, MagicHound, MinerTrojan, PUA, Ramnit, Sality,
# Tinba, TrickBot, Trickster, TrojanDownloader, Ursnif, WebCompanion, benign
#
# cicids2017 (data/raw/cicids2017/2_training_set): 441,116 training rows,
# 8 classes: DDoS, DoS, benign, ftp-patator, infiltration, portScan,
# ssh-patator, webAttack
#
# LABEL AVAILABILITY — 1_test-std_set / 0_test-challenge_set
# ----------------------------------------------------------
# VERIFICATION STATUS: the record-level check (opening a few records from
# each test set to look for a ground-truth label field) could NOT be
# performed when this file was written — the raw data was not readable in
# that session, and the split manifests in data/splits/ (netml_split.json,
# cicids2017_split.json) are empty and carry no label information. What IS
# established is the NetML 2020 challenge design itself: test-std and
# test-challenge were held-back leaderboard splits whose ground-truth
# annotations were NOT distributed to participants. This config therefore
# conservatively declares labels_available: false for both datasets.
#
# ACTION REQUIRED: run scripts/validate_data.py once the raw data is in
# place. If it finds annotation files for either test set, flip that
# dataset's labels_available to true and update docs/CONFIG.md. Until then,
# the test sets may ONLY be used for unsupervised inference / demo purposes
# — never for evaluation.

data:
  netml2020:
    raw_dir: data/raw/netml2020
    training_set: data/raw/netml2020/2_training_set/2_training_set.json.gz
    training_annotations: data/raw/netml2020/2_training_annotations
    # Labels NOT found for either test split (challenge withheld test
    # annotations; pending re-verification via scripts/validate_data.py —
    # see LABEL AVAILABILITY note above).
    test_std_dir: data/raw/netml2020/1_test-std_set
    test_challenge_dir: data/raw/netml2020/0_test-challenge_set
    labels_available: false
    feature_dim: 121
    num_classes: 21
    class_map:
      Adload: 0
      Artemis: 1
      BitCoinMiner: 2
      CCleaner: 3
      Cobalt: 4
      Downware: 5
      Dridex: 6
      Emotet: 7
      HTBot: 8
      MagicHound: 9
      MinerTrojan: 10
      PUA: 11
      Ramnit: 12
      Sality: 13
      Tinba: 14
      TrickBot: 15
      Trickster: 16
      TrojanDownloader: 17
      Ursnif: 18
      WebCompanion: 19
      benign: 20

  cicids2017:
    raw_dir: data/raw/cicids2017
    training_set: data/raw/cicids2017/2_training_set/2_training_set.json.gz
    training_annotations: data/raw/cicids2017/2_training_annotations
    # Labels NOT found for either test split (challenge withheld test
    # annotations; pending re-verification via scripts/validate_data.py —
    # see LABEL AVAILABILITY note above).
    test_std_dir: data/raw/cicids2017/1_test-std_set
    test_challenge_dir: data/raw/cicids2017/0_test-challenge_set
    labels_available: false
    feature_dim: 121
    num_classes: 8
    class_map:
      DDoS: 0
      DoS: 1
      benign: 2
      ftp-patator: 3
      infiltration: 4
      portScan: 5
      ssh-patator: 6
      webAttack: 7

  processed_dir: data/processed/

splitting:
  # No train/test split is needed: the raw data is already pre-divided by
  # file into training / test-std / test-challenge folders by the original
  # challenge (see DATASET CONTEXT above). Only two splits are configured
  # here:
  #
  # 1. val_split — a stratified fraction held out FROM the training_set
  #    only, used for early stopping / model selection. Governed by
  #    random_seed below for reproducibility.
  # 2. zero_day_classes — per-dataset class lists excluded from initial
  #    TCN training and held out for Stage 3 (SF-SOINN) zero-day
  #    evaluation. See the TODO below; both start empty on purpose.
  val_split: 0.15
  random_seed: 42
  zero_day_classes:
    # TODO: Fill in after running scripts/validate_data.py and reviewing
    # docs/data_report.png — pick 3-5 lower-frequency, non-benign classes
    # per dataset to exclude from initial TCN training and hold out for
    # Stage 3 (SF-SOINN) zero-day evaluation. Do not guess this without
    # checking real per-class counts first.
    netml2020: []
    cicids2017: []

model:
  # Denoising autoencoder gate: compresses each 121-dim raw flow vector
  # into this latent size before the temporal stage.
  denoising_gate:
    latent_dim: 32

  # Temporal convolutional engine operating over sequences of latent
  # embeddings. `dilations` gives an exponentially growing receptive field.
  temporal_engine:
    channels: [64, 64, 32]
    kernel_size: 3
    dilations: [1, 2, 4, 8]
    dropout: 0.2

  zeroday_hunter:
    # Starting value only — must be empirically tuned once real latent
    # vectors exist, do not treat as final.
    similarity_threshold: 0.5

  # Known-vs-unknown gate: route a flow to the closed-set classifier when
  # its confidence is at/above this threshold, else to the zero-day hunter.
  routing:
    confidence_threshold: 0.5

training:
  batch_size: 256
  learning_rate: 0.001
  random_seed: 42

device:
  # Resolved by utils/device.py from step 3 ('auto' picks cuda/mps/cpu).
  preference: auto
