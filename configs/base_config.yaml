# ==============================================================================
# AE_TCN_SFSONIN project — configs/base_config.yaml
# ==============================================================================
#
# DATASET CONTEXT
# ---------------
# Both datasets have 121 raw features per flow (same schema).
#
# netml2020 (data/raw/netml2020/2_training_set): 387,268 training rows,
# 21 classes: Adload, Artemis, BitCoinMiner, CCleaner, Cobalt, Downware,
# Dridex, Emotet, HTBot, MagicHound, MinerTrojan, PUA, Ramnit, Sality,
# Tinba, TrickBot, Trickster, TrojanDownloader, Ursnif, WebCompanion, benign
#
# cicids2017 (data/raw/cicids2017/2_training_set): 441,116 training rows,
# 8 classes: DDoS, DoS, benign, ftp-patator, infiltration, portScan,
# ssh-patator, webAttack
#
# LABEL AVAILABILITY — 1_test-std_set / 0_test-challenge_set
# ----------------------------------------------------------

data:
  netml2020:
    raw_dir: data/raw/netml2020
    training_set: data/raw/netml2020/2_training_set/2_training_set.json.gz
    training_annotations: "data/raw/netml2020/2_training_annotations/2_training_anno_fine.json.gz"
    # Labels NOT found for either test split (challenge withheld test
    # annotations; pending re-verification via scripts/validate_data.py —
    # see LABEL AVAILABILITY note above).
    test_std_dir: data/raw/netml2020/1_test-std_set
    test_challenge_dir: data/raw/netml2020/0_test-challenge_set
    labels_available: false
    feature_dim: 121
    num_classes: 21
    class_map:
      Adload: 0
      Artemis: 1
      BitCoinMiner: 2
      CCleaner: 3
      Cobalt: 4
      Downware: 5
      Dridex: 6
      Emotet: 7
      HTBot: 8
      MagicHound: 9
      MinerTrojan: 10
      PUA: 11
      Ramnit: 12
      Sality: 13
      Tinba: 14
      TrickBot: 15
      Trickster: 16
      TrojanDownloader: 17
      Ursnif: 18
      WebCompanion: 19
      benign: 20

  cicids2017:
    raw_dir: data/raw/cicids2017
    training_set: data/raw/cicids2017/2_training_set/2_training_set.json.gz
    training_annotations: "data/raw/cicids2017/2_training_annotations/2_training_anno_fine.json.gz"
    test_std_dir: data/raw/cicids2017/1_test-std_set
    test_challenge_dir: data/raw/cicids2017/0_test-challenge_set
    labels_available: false
    feature_dim: 121
    num_classes: 8
    class_map:
      DDoS: 0
      DoS: 1
      benign: 2
      ftp-patator: 3
      infiltration: 4
      portScan: 5
      ssh-patator: 6
      webAttack: 7

  processed_dir: data/processed/

splitting:
  # 1. val_split — a stratified fraction held out FROM the training_set
  #    only, used for early stopping / model selection. Governed by
  #    random_seed below for reproducibility.
  # 2. zero_day_classes — per-dataset class lists excluded from initial
  #    TCN training and held out for Stage 3 (SF-SOINN) zero-day
  #    evaluation.
  val_split: 0.15
  random_seed: 42
  zero_day_classes:
    netml2020: []
    cicids2017: []

model:
  # Denoising autoencoder gate: compresses each 121-dim raw flow vector
  # into this latent size before the temporal stage.
  denoising_gate:
    latent_dim: 32

  # Temporal convolutional engine operating over sequences of latent
  # embeddings. `dilations` gives an exponentially growing receptive field.
  temporal_engine:
    channels: [64, 64, 32]
    kernel_size: 3
    dilations: [1, 2, 4, 8]
    dropout: 0.2

  zeroday_hunter:
    # Starting value only — must be empirically tuned once real latent
    # vectors exist, do not treat as final.
    similarity_threshold: 0.5

  # Known-vs-unknown gate: route a flow to the closed-set classifier when
  # its confidence is at/above this threshold, else to the zero-day hunter.
  routing:
    confidence_threshold: 0.5

training:
  batch_size: 256
  learning_rate: 0.001
  random_seed: 42

device:
  # Resolved by utils/device.py from step 3 ('auto' picks cuda/mps/cpu).
  preference: auto
